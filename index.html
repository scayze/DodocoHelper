<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5edd8" />
    <meta
      name="description"
      content="Dodoco Solver reads a crown puzzle screenshot and returns the solved board with every crown placed."
    />
    <title>Dodoco Solver - Crown Puzzle Companion</title>
    <style>
      html { background: #f5edd8; }
    </style>
  </head>
  <body>
    <div class="parchment-page min-h-[100dvh]">
      <main id="top" class="mx-auto w-full max-w-5xl px-4">
        <section class="grid grid-cols-1 items-center gap-10 pt-14 pb-10 md:grid-cols-2 md:pt-20">
          <div>
            <p class="text-[11px] font-semibold uppercase tracking-[0.22em] text-gold-600">
              Genshin crown puzzle companion
            </p>
            <h1 class="font-display mt-4 max-w-[14ch] text-4xl leading-[1.05] tracking-tight text-night-900 md:text-6xl">
              Upload the board. Place every crown.
            </h1>
          </div>
          <div>
            <div
              id="dropzone"
              role="button"
              tabindex="0"
              aria-label="Upload a board screenshot"
              class="grid min-h-56 cursor-pointer place-items-center rounded-2xl border-2 border-dashed border-night-700/30 bg-white/50 px-6 py-10 text-center text-night-900 shadow-[0_16px_50px_rgba(60,45,10,0.12)] transition-colors hover:border-gold-600"
            >
              <div>
                <svg width="36" height="36" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" class="mx-auto text-night-700/70" aria-hidden="true">
                  <rect x="32" y="32" width="192" height="192" rx="16" />
                  <circle cx="100" cy="100" r="16" fill="currentColor" stroke="none" />
                  <path d="m32,192 60-60 40,40 32-32 60,60" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <p id="dropzone-title" class="mt-3 font-semibold">Drag a screenshot here</p>
                <p class="mx-auto mt-1 max-w-[34ch] text-sm text-night-800/70">
                  Best with a cropped shot of the board and clear grid lines.
                </p>
                <span class="btn-gold mt-4 inline-flex items-center gap-2 rounded-full px-5 py-2.5 text-sm font-semibold">
                  <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                    <path d="M224,152v56a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V152a8,8,0,0,1,16,0v56H208V152a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,132.69V40a8,8,0,0,0-16,0v92.69L93.66,106.34a8,8,0,0,0-11.32,11.32Z" />
                  </svg>
                  Choose image
                </span>
              </div>
            </div>
            <input
              id="file-input"
              type="file"
              accept="image/png,image/jpeg,image/webp"
              class="sr-only"
              tabindex="-1"
              aria-hidden="true"
            />
          </div>
        </section>

        <section id="solver" class="scroll-mt-20 pb-20">
          <div id="result-area" class="hidden">
            <div class="mx-auto max-w-3xl">

              <div id="panel-working" class="hidden">
                <div class="grid w-full grid-cols-9 gap-1.5 rounded-2xl bg-night-800 p-3" aria-hidden="true" id="skeleton-grid"></div>
                <p class="mt-3 flex items-center gap-2 text-sm font-semibold text-night-800/70" role="status">
                  <span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-gold-600 border-t-transparent" aria-hidden="true"></span>
                  Reading grid lines and region colors...
                </p>
              </div>

              <div id="panel-error" class="hidden rounded-2xl border border-red-800/30 bg-red-950/95 p-6" role="alert">
                <p class="flex items-center gap-2 font-semibold text-red-100">
                  <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                    <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm-8,48a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm8,104a16,16,0,1,1,16-16A16,16,0,0,1,128,176Z" />
                  </svg>
                  <span id="error-title">Something missed the mark.</span>
                </p>
                <p id="error-hint" class="mt-2 text-sm leading-relaxed text-red-200/85"></p>
                <div class="mt-4">
                  <button
                    id="retry-button"
                    type="button"
                    class="btn-gold rounded-full px-5 py-2.5 text-sm font-semibold"
                  >
                    Try another image
                  </button>
                </div>
              </div>

              <div id="panel-ready" class="hidden rounded-2xl border border-night-700/15 bg-white/50 p-5 text-night-900 shadow-[0_16px_50px_rgba(60,45,10,0.12)]">
                <div class="flex flex-col gap-5 sm:flex-row">
                  <figure class="min-w-0 flex-1">
                    <div
                      id="board-grid"
                      role="img"
                      aria-label="Puzzle board with regions, marks, and crowns"
                      class="grid w-full gap-1.5 rounded-xl bg-[rgb(95,112,128)] p-1.5"
                    ></div>
                  </figure>
                  <div class="flex flex-row gap-2 sm:w-40 sm:flex-col sm:justify-center">
                    <button
                      id="solve-button"
                      type="button"
                      class="btn-gold flex-1 rounded-full px-5 py-2.5 text-sm font-semibold disabled:cursor-not-allowed disabled:opacity-50 sm:flex-none"
                    >
                      Solve
                    </button>
                    <button
                      id="hint-button"
                      type="button"
                      class="btn-outline flex-1 rounded-full px-5 py-2.5 text-sm font-semibold disabled:cursor-not-allowed disabled:opacity-50 sm:flex-none"
                    >
                      <span id="hint-label">Hint</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
