<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5edd8" />
    <meta name="description" content="Dodoco Solver reads a crown puzzle screenshot and returns the solved board with every crown placed." />
    <title>Dodoco Solver - Crown Puzzle Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html {
        background: #f5edd8;
      }
    </style>
  </head>
  <body>
    <div class="parchment-page">
      <main id="top" class="mx-auto flex h-full min-h-0 w-full max-w-6xl flex-1 flex-col justify-center px-[18px] sm:px-[26px]">
        <header class="shrink-0 pt-[22px] pb-[13px] text-center md:pt-[26px] md:pb-[18px]">
          <!-- Home + game tabs: Lucide home/crown/leaf/tent (ISC) + Phosphor bomb (MIT), inlined as SVG like the upload cards below. -->
          <nav aria-label="Primary" class="flex items-center justify-center gap-5 text-gold-600">
            <button id="nav-home" type="button" class="mode-btn font-semibold text-gold-600" aria-label="Home" title="Home">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
              </svg>
            </button>
            <span aria-hidden="true" class="h-6 w-[2px] shrink-0 bg-gold-600/30"></span>
            <button id="game-crowns" type="button" class="mode-btn text-gold-600/50" aria-label="Crowns" title="Crowns">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z" />
                <path d="M5 21h14" />
              </svg>
            </button>
            <button id="game-minesweeper" type="button" class="mode-btn text-gold-600/50" aria-label="Minesweeper" title="Minesweeper">
              <svg width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                <path
                  d="M248,32h0a8,8,0,0,0-8,8,52.66,52.66,0,0,1-3.57,17.39C232.38,67.22,225.7,72,216,72c-11.06,0-18.85-9.76-29.49-24.65C176,32.66,164.12,16,144,16c-16.39,0-29,8.89-35.43,25a66.07,66.07,0,0,0-3.9,15H88A16,16,0,0,0,72,72v9.59A88,88,0,0,0,112,248h1.59A88,88,0,0,0,152,81.59V72a16,16,0,0,0-16-16H120.88a46.76,46.76,0,0,1,2.69-9.37C127.62,36.78,134.3,32,144,32c11.06,0,18.85,9.76,29.49,24.65C184,71.34,195.88,88,216,88c16.39,0,29-8.89,35.43-25A68.69,68.69,0,0,0,256,40,8,8,0,0,0,248,32ZM140.8,94a72,72,0,1,1-57.6,0A8,8,0,0,0,88,86.66V72h48V86.66A8,8,0,0,0,140.8,94ZM111.89,209.32A8,8,0,0,1,104,216a8.52,8.52,0,0,1-1.33-.11,57.5,57.5,0,0,1-46.57-46.57,8,8,0,1,1,15.78-2.64,41.29,41.29,0,0,0,33.43,33.43A8,8,0,0,1,111.89,209.32Z" />
              </svg>
            </button>
            <button id="game-seasons" type="button" class="mode-btn text-gold-600/50" aria-label="Seasons" title="Seasons">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 20a10 10 0 0 0 10-10 25.9 25.9 0 0 0-1.04-7.281 1 1 0 0 0-1.755-.325C15.833 5.5 13 5.5 9.8 6.1A7 7 0 0 0 11 20" />
                <path d="M2 21a5 5 0 0 1 2.911-4.544C7.613 15.212 8.351 15.24 11 13" />
              </svg>
            </button>
            <button id="game-tents" type="button" class="mode-btn text-gold-600/50" aria-label="Tents &amp; Trees" title="Tents &amp; Trees">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3.5 21 14 3" />
                <path d="M20.5 21 10 3" />
                <path d="M15.5 21 12 15l-3.5 6" />
                <path d="M2 21h20" />
              </svg>
            </button>
          </nav>
          <h1 id="game-title" class="font-display mt-[7px] text-[26px] leading-none tracking-tight text-balance text-night-900 md:text-[2.2rem]">
            Home
          </h1>
        </header>

        <section id="home" class="grid min-h-0 w-full shrink-0 place-items-center py-[9px]">
          <div class="mx-auto w-full" id="home-col">
            <div id="home-panel" class="rounded-2xl border border-night-700/15 bg-white/60 p-[18px] text-night-900 shadow-[0_16px_50px_rgba(60,45,10,0.12)] backdrop-blur-sm" tabindex="-1">
              <div class="flex flex-col gap-[13px]">
                <h2 class="text-center text-[15px] font-bold uppercase tracking-[0.18em] text-gold-600">Leaderboard</h2>
                <p class="text-center text-[15px] font-semibold leading-relaxed text-night-800/80">
                  Season 1 is coming soon. Dummy standings below.
                </p>
                <ol class="flex flex-col gap-[9px]">
                  <li class="flex items-center gap-[13px] rounded-xl bg-white/70 px-[18px] py-[13px] shadow-sm">
                    <span class="w-[28px] shrink-0 text-center text-[15px] font-bold text-gold-600">1</span>
                    <span class="h-[32px] w-[32px] shrink-0 rounded-full bg-gold-600/20" aria-hidden="true"></span>
                    <span class="min-w-0 flex-1 truncate text-[15px] font-semibold">Dodoco</span>
                    <span class="shrink-0 text-[15px] font-bold tabular-nums">1,250</span>
                  </li>
                  <li class="flex items-center gap-[13px] rounded-xl bg-white/70 px-[18px] py-[13px] shadow-sm">
                    <span class="w-[28px] shrink-0 text-center text-[15px] font-bold text-gold-600">2</span>
                    <span class="h-[32px] w-[32px] shrink-0 rounded-full bg-gold-600/20" aria-hidden="true"></span>
                    <span class="min-w-0 flex-1 truncate text-[15px] font-semibold">Paimon</span>
                    <span class="shrink-0 text-[15px] font-bold tabular-nums">1,100</span>
                  </li>
                  <li class="flex items-center gap-[13px] rounded-xl bg-white/70 px-[18px] py-[13px] shadow-sm">
                    <span class="w-[28px] shrink-0 text-center text-[15px] font-bold text-gold-600">3</span>
                    <span class="h-[32px] w-[32px] shrink-0 rounded-full bg-gold-600/20" aria-hidden="true"></span>
                    <span class="min-w-0 flex-1 truncate text-[15px] font-semibold">Traveler</span>
                    <span class="shrink-0 text-[15px] font-bold tabular-nums">980</span>
                  </li>
                </ol>
              </div>
            </div>
          </div>
        </section>

        <section id="upload" class="flex shrink-0 justify-center pb-[13px]">
          <div class="w-full" id="upload-actions">
            <div class="flex flex-row items-stretch gap-[9px]">
              <button id="screenshot-button" type="button" aria-label="Start from a screenshot"
                class="upload-card grid min-h-[163px] flex-1 cursor-pointer place-items-center rounded-2xl border-2 border-dashed border-night-700/30 bg-white/50 px-[18px] py-[26px] text-center text-night-900 shadow-[0_16px_50px_rgba(60,45,10,0.12)] transition-colors hover:border-gold-600">
                <span>
                  <svg width="35" height="35" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" class="mx-auto text-night-700/70" aria-hidden="true">
                    <rect x="32" y="32" width="192" height="192" rx="16" />
                    <circle cx="100" cy="100" r="16" fill="currentColor" stroke="none" />
                    <path d="m32,192 60-60 40,40 32-32 60,60" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                  <span class="upload-card-text block">
                    <span class="mt-[11px] block text-[15px] font-semibold">Start from a screenshot</span>
                    <span class="mx-auto mt-[4px] block max-w-[34ch] text-[15px] text-night-800/70">
                      Paste, drag, or click to browse.
                    </span>
                  </span>
                </span>
              </button>
              <button id="generate-button" type="button" aria-label="Generate a level for me"
                class="upload-card grid min-h-[163px] flex-1 cursor-pointer place-items-center rounded-2xl border-2 border-dashed border-night-700/30 bg-white/50 px-[18px] py-[26px] text-center text-night-900 shadow-[0_16px_50px_rgba(60,45,10,0.12)] transition-colors hover:border-gold-600">
                <span>
                  <svg width="35" height="35" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" class="mx-auto text-night-700/70" aria-hidden="true">
                    <rect x="32" y="32" width="192" height="192" rx="48" />
                    <circle cx="88" cy="88" r="16" fill="currentColor" stroke="none" />
                    <circle cx="168" cy="88" r="16" fill="currentColor" stroke="none" />
                    <circle cx="128" cy="128" r="16" fill="currentColor" stroke="none" />
                    <circle cx="88" cy="168" r="16" fill="currentColor" stroke="none" />
                    <circle cx="168" cy="168" r="16" fill="currentColor" stroke="none" />
                  </svg>
                  <span class="upload-card-text block">
                    <span class="mt-[11px] block text-[15px] font-semibold">Generate a level for me</span>
                    <span class="mx-auto mt-[4px] block max-w-[34ch] text-[15px] text-night-800/70">
                      A fresh random board, ready to play.
                    </span>
                  </span>
                </span>
              </button>
            </div>
            <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp" class="sr-only" />
          </div>
        </section>

        <section id="solver" class="grid min-h-0 w-full shrink-0 place-items-center py-[9px]">
          <div id="result-area" class="hidden w-full min-h-0" aria-live="polite">
            <div class="mx-auto w-full" id="stage-col">

              <div id="panel-working" class="hidden" tabindex="-1">
                <div class="grid w-full grid-cols-9 rounded-2xl bg-night-800" aria-hidden="true" id="skeleton-grid"></div>
                <p class="mt-[13px] flex items-center justify-center gap-[9px] text-[15px] font-semibold text-night-800/70" role="status">
                  <span class="inline-block h-[18px] w-[18px] animate-spin rounded-full border-2 border-gold-600 border-t-transparent" aria-hidden="true"></span>
                  Reading grid lines and region colors...
                </p>
              </div>

              <div id="panel-error" class="hidden rounded-2xl border border-red-800/30 bg-red-950/95 p-[26px]" role="alert" tabindex="-1">
                <p class="flex items-center gap-2 font-semibold text-red-100">
                  <svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                    <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm-8,48a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm8,104a16,16,0,1,1,16-16A16,16,0,0,1,128,176Z" />
                  </svg>
                  <span id="error-title">Something missed the mark.</span>
                </p>
                <p id="error-hint" class="mt-[9px] text-[15px] leading-relaxed text-red-200/85"></p>
                <div class="mt-[18px]">
                  <button id="retry-button" type="button" class="btn-gold h-[48px] rounded-full px-[22px] text-[15px] font-semibold">
                    Try another image
                  </button>
                </div>
              </div>

              <div id="panel-ready" class="hidden rounded-2xl border border-night-700/15 bg-white/60 p-[18px] text-night-900 shadow-[0_16px_50px_rgba(60,45,10,0.12)] backdrop-blur-sm" tabindex="-1">
                <div class="flex flex-col gap-[13px]">
                  <figure class="min-w-0 flex-1">
                    <div id="board-grid" role="grid" aria-label="Puzzle board with regions, marks, and crowns" class="grid w-full rounded-xl bg-[rgb(95,112,128)]"></div>
                  </figure>
                  <p id="hint-level" class="text-center text-[11px] font-bold uppercase tracking-[0.18em] text-gold-600" aria-hidden="true"></p>
                  <p id="hint-message" class="min-h-[24px] whitespace-pre-line text-center text-[15px] font-semibold leading-relaxed text-night-800/80" role="status" aria-live="polite"></p>
                  <div class="flex flex-row gap-[9px]">
                    <button id="undo-button" type="button" class="btn-outline h-[48px] flex-1 rounded-full px-[22px] text-[15px] font-semibold disabled:cursor-not-allowed disabled:opacity-50" disabled>
                      Undo
                    </button>
                    <button id="hint-button" type="button" class="btn-outline h-[48px] flex-1 rounded-full px-[22px] text-[15px] font-semibold disabled:cursor-not-allowed disabled:opacity-50">
                      <span id="hint-label">Hint</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
        <section id="mines" class="hidden grid min-h-0 w-full shrink-0 place-items-center py-[9px]">
          <div class="mx-auto w-full" id="mines-col">
            <div id="mines-panel" class="rounded-2xl border border-night-700/15 bg-white/60 p-[18px] text-night-900 shadow-[0_16px_50px_rgba(60,45,10,0.12)] backdrop-blur-sm" tabindex="-1">
              <div class="flex flex-col gap-[13px]">
                <figure class="min-w-0 flex-1">
                  <div id="mines-grid" role="grid" aria-label="Minesweeper board" class="grid w-full"></div>
                </figure>
                <p id="mines-level" class="text-center text-[11px] font-bold uppercase tracking-[0.18em] text-gold-600" aria-hidden="true"></p>
                <p id="mines-message" class="min-h-[24px] whitespace-pre-line text-center text-[15px] font-semibold leading-relaxed text-night-800/80" role="status" aria-live="polite"></p>
                <div class="flex flex-row gap-[9px]">
                  <button id="mines-new-button" type="button" class="btn-outline h-[48px] flex-1 rounded-full px-[22px] text-[15px] font-semibold">
                    New
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>
        <section id="seasons" class="hidden grid min-h-0 w-full shrink-0 place-items-center py-[9px]">
          <div class="mx-auto w-full" id="seasons-col">
            <div id="seasons-panel" class="rounded-2xl border border-night-700/15 bg-white/60 p-[18px] text-night-900 shadow-[0_16px_50px_rgba(60,45,10,0.12)] backdrop-blur-sm" tabindex="-1">
              <div class="flex flex-col gap-[13px]">
                <figure class="min-w-0 flex-1">
                  <div id="seasons-grid" role="grid" aria-label="Seasons board" class="grid w-full"></div>
                </figure>
                <p id="seasons-level" class="text-center text-[11px] font-bold uppercase tracking-[0.18em] text-gold-600" aria-hidden="true"></p>
                <p id="seasons-message" class="min-h-[24px] whitespace-pre-line text-center text-[15px] font-semibold leading-relaxed text-night-800/80" role="status" aria-live="polite"></p>
                <div class="flex flex-row gap-[9px]">
                  <button id="seasons-new-button" type="button" class="btn-outline h-[48px] flex-1 rounded-full px-[22px] text-[15px] font-semibold">
                    New
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>
        <section id="tents" class="hidden grid min-h-0 w-full shrink-0 place-items-center py-[9px]">
          <div class="mx-auto w-full" id="tents-col">
            <div id="tents-panel" class="rounded-2xl border border-night-700/15 bg-white/60 p-[18px] text-night-900 shadow-[0_16px_50px_rgba(60,45,10,0.12)] backdrop-blur-sm" tabindex="-1">
              <div class="flex flex-col gap-[13px]">
                <figure class="min-w-0 flex-1">
                  <div id="tents-grid" role="grid" aria-label="Tents and Trees board" class="grid w-full"></div>
                </figure>
                <p id="tents-level" class="text-center text-[11px] font-bold uppercase tracking-[0.18em] text-gold-600" aria-hidden="true"></p>
                <p id="tents-message" class="min-h-[24px] whitespace-pre-line text-center text-[15px] font-semibold leading-relaxed text-night-800/80" role="status" aria-live="polite"></p>
                <div class="flex flex-row gap-[9px]">
                  <button id="tents-new-button" type="button" class="btn-outline h-[48px] flex-1 rounded-full px-[22px] text-[15px] font-semibold">
                    New
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
