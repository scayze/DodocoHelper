<section id="seasons" class="hidden grid min-h-0 w-full shrink-0 place-items-center pt-[2px] pb-[9px]">
          <div class="mx-auto w-full" id="seasons-col">
            <div id="seasons-panel" class="rounded-2xl border border-night-700/15 bg-white/60 p-[18px] text-night-900 shadow-[0_16px_50px_rgba(60,45,10,0.12)] backdrop-blur-sm" tabindex="-1">
              <div class="flex flex-col gap-[13px]">
                <div id="seasons-game-view" class="flex flex-col gap-[13px]">
                <div class="meta-row">
                  <span id="seasons-timer" class="meta-pill" role="timer" aria-label="Elapsed time">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <circle cx="12" cy="13" r="8" />
                      <path d="M12 9v4l2.5 2.5" />
                      <path d="M9 2h6" />
                    </svg>
                    <span id="seasons-timer-value">0:00</span>
                    </span>
                    <div id="seasons-mode" class="mode-toggle" role="group" aria-label="Play mode">
                      <button id="seasons-mode-daily" type="button" class="mode-toggle-btn is-active" aria-pressed="true">Daily</button>
                      <span id="seasons-mode-sep" aria-hidden="true" class="mode-toggle-sep">|</span>
                      <button id="seasons-mode-endless" type="button" class="mode-toggle-btn" aria-pressed="false">Endless</button>
                    </div>
                    <span id="seasons-level" class="meta-pill is-counter" aria-hidden="true"></span>
                </div>
                <div class="game-stage">
                  <figure id="seasons-grid-wrap" class="min-w-0 flex-1">
                    <div id="seasons-grid" role="grid" aria-label="Seasons board" class="grid w-full"></div>
                  </figure>
                  <div id="seasons-lb-view" class="lb-overlay hidden flex-col gap-[13px]">
                  <div class="flex items-center gap-[9px]">
                    <button id="seasons-lb-prev" type="button" aria-label="Previous day" title="Previous day"
                      class="btn-outline grid h-[36px] w-[36px] shrink-0 place-items-center rounded-full disabled:cursor-not-allowed disabled:opacity-50">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m15 18-6-6 6-6" />
                      </svg>
                    </button>
                    <div class="min-w-0 flex-1 text-center">
                      <h2 class="text-[15px] font-bold uppercase tracking-[0.18em] text-gold-600">Leaderboard</h2>
                      <p id="seasons-lb-day" class="mt-[4px] text-[15px] font-semibold leading-relaxed text-night-800/80">today</p>
                    </div>
                    <button id="seasons-lb-next" type="button" aria-label="Next day" title="Next day"
                      class="btn-outline grid h-[36px] w-[36px] shrink-0 place-items-center rounded-full disabled:cursor-not-allowed disabled:opacity-50">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m9 18 6-6-6-6" />
                      </svg>
                    </button>
                  </div>
                  <ol id="seasons-lb-list" class="lb-list flex flex-col gap-[9px]"></ol>
                  <p id="seasons-lb-status" class="min-h-[24px] text-center text-[15px] font-semibold leading-relaxed text-night-800/70" role="status" aria-live="polite"></p>
                  </div>
                </div>
                <p id="seasons-message" class="min-h-[24px] whitespace-pre-line text-center text-[15px] font-semibold leading-relaxed text-night-800/80" role="status" aria-live="polite"></p>
                </div>
                <div id="seasons-settings" class="hidden flex-col gap-[9px] rounded-xl bg-white/70 px-[18px] py-[13px] shadow-sm">
                  <label class="settings-row" for="seasons-set-size">
                    <span>Board size</span>
                    <input id="seasons-set-size" type="number" min="6" max="12" step="1" inputmode="numeric" />
                  </label>
                </div>
                <div class="flex flex-row justify-between gap-[9px]">
                  <button id="seasons-view-toggle" type="button" class="btn-outline game-btn h-[48px] w-[48px] rounded-full disabled:cursor-not-allowed disabled:opacity-50" aria-label="Show leaderboard" title="Show leaderboard" aria-expanded="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
                      <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
                      <path d="M4 22h16" />
                      <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
                      <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
                      <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
                    </svg>
                  </button>
                  <button id="seasons-settings-toggle" type="button" class="btn-outline game-btn hidden h-[48px] w-[48px] rounded-full disabled:cursor-not-allowed disabled:opacity-50" aria-label="Endless settings" title="Endless settings" aria-expanded="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <circle cx="12" cy="12" r="3" />
                      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                  </button>
                  <button id="seasons-regen" type="button" class="btn-outline game-btn hidden h-[48px] w-[48px] rounded-full disabled:cursor-not-allowed disabled:opacity-50" aria-label="New endless board" title="New endless board">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                      <path d="M21 3v6h-6" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>
